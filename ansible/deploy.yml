---
- name: Deploy Docker Application to EC2
  hosts: all
  become: true
  tasks:
    - name: Wait 3 minutes for SSH connection to become available
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 180

    - name: Gather facts after SSH is ready
      ansible.builtin.setup:

    - name: Install Docker
      ansible.builtin.package:
        name: docker.io
        state: present

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Copy Docker image tar archive to EC2
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ image_name }}.tar"
        dest: "/tmp/{{ image_name }}.tar"

    - name: Load Docker image
      ansible.builtin.command:
        cmd: "docker load -i /tmp/{{ image_name }}.tar"

    - name: Stop existing application container (if running)
      ansible.builtin.command:
        cmd: "docker stop {{ container_name }}"
      ignore_errors: true

    - name: Remove existing application container
      ansible.builtin.command:
        cmd: "docker rm {{ container_name }}"
      ignore_errors: true

    - name: Run application container
      ansible.builtin.command:
        cmd: "docker run -d --name {{ container_name }} -p {{ app_port }}:{{ container_port }} {{ image_name }}:latest"

    - name: Clean up remote image tarball
      ansible.builtin.file:
        path: "/tmp/{{ image_name }}.tar"
        state: absent